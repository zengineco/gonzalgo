[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gonzalgo"
version = "0.5.1"
description = "Measure where a formal library spends its axioms: Lean 4 and Metamath."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Vince Gonzalez" }]
keywords = [
    "lean4", "mathlib", "metamath", "formal-verification", "proof-assistant",
    "axiom-of-choice", "dependency-analysis", "constructive-mathematics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The MCP server is optional so the analysis tools stay dependency-light for
# anyone who only wants the CLI.
mcp = ["mcp>=2.0"]

[project.urls]
Paper = "https://doi.org/10.5281/zenodo.21769846"
Source = "https://github.com/zengineco/gonzalgo"
Issues = "https://github.com/zengineco/gonzalgo/issues"

[project.scripts]
gonzalgo = "gonzalgo.cli:main"
gonzalgo-mcp = "gonzalgo.mcp_server:main"

[tool.hatch.build.targets.wheel]
# lean_files/ lives inside the package directory and is shipped with it; a
# force-include entry would duplicate it and fail the build
packages = ["src/gonzalgo"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
